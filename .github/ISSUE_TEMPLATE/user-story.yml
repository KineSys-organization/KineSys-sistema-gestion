name: Historia de Usuario
description: Nueva HU fuera de las HU-01 a HU-23 ya cargadas en el Product Backlog.
title: "[HU-XX] "
labels: ["type: hu"]
body:
  - type: textarea
    id: como
    attributes:
      label: Como
    validations:
      required: true
  - type: textarea
    id: quiero
    attributes:
      label: Quiero
    validations:
      required: true
  - type: textarea
    id: para
    attributes:
      label: Para
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Formato Dado/Cuando/Entonces cuando sea posible.
    validations:
      required: true
  - type: textarea
    id: reglas
    attributes:
      label: Reglas de negocio
    validations:
      required: false
  - type: dropdown
    id: incremento
    attributes:
      label: Incremento
      options:
        - Incremento 1
        - Incremento 2
        - Incremento 3
        - Futuro
    validations:
      required: true
  - type: dropdown
    id: modulo
    attributes:
      label: Módulo
      options:
        - Configuración
        - Seguridad
        - Profesionales
        - Pacientes
        - Turnos
        - Agenda
        - Atención
        - Pagos
        - Indicadores
        - Autogestión
    validations:
      required: true
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options:
        - Alta
        - Media
        - Baja
    validations:
      required: true
  - type: input
    id: story_points
    attributes:
      label: Story Points
      description: Dejar vacío si la HU es Futura / no comprometida.
    validations:
      required: false
