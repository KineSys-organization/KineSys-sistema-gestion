name: Pruebas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

jobs:
  tests:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test
